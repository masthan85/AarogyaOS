# Local development stack. Production deployment is documented in docs/DEPLOYMENT.md.
services:
  db:
    # pgvector image: reference search then runs in the database (optional; see docs/OPERATIONS.md).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      AAROGYA_APP_DB_PASSWORD: ${AAROGYA_APP_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  migrate:
    # One-shot: apply migrations and sync reference data before the API starts.
    build: ../services/api
    command: ["sh", "-c", "python -m alembic upgrade head && python -m app.cli seed"]
    environment:
      AAROGYA_ENVIRONMENT: ${AAROGYA_ENVIRONMENT:-development}
      AAROGYA_DATABASE_URL: postgresql+psycopg://aarogya_app:${AAROGYA_APP_DB_PASSWORD}@db:5432/aarogya
      AAROGYA_JWT_SECRET: ${AAROGYA_JWT_SECRET:?set in .env}
      AAROGYA_FIELD_ENCRYPTION_KEY: ${AAROGYA_FIELD_ENCRYPTION_KEY:?set in .env}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: ../services/api
    environment:
      AAROGYA_ENVIRONMENT: ${AAROGYA_ENVIRONMENT:-development}
      AAROGYA_DATABASE_URL: postgresql+psycopg://aarogya_app:${AAROGYA_APP_DB_PASSWORD}@db:5432/aarogya
      AAROGYA_JWT_SECRET: ${AAROGYA_JWT_SECRET:?set in .env}
      AAROGYA_FIELD_ENCRYPTION_KEY: ${AAROGYA_FIELD_ENCRYPTION_KEY:?set in .env}
      AAROGYA_SPEECH_PROVIDER: ${AAROGYA_SPEECH_PROVIDER:-}
      AAROGYA_AUDIO_STORE_PATH: /var/lib/aarogya/audio
    volumes:
      - audio:/var/lib/aarogya/audio
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["8000:8000"]

volumes:
  pgdata:
  audio:
