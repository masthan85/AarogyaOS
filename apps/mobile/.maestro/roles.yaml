# Each demo role signs in and sees only its own sections (mirrors e2e/tests/roles.spec.ts).
appId: in.aarogyaos.app
---
- runFlow: { file: subflows/role.yaml, env: { EMAIL: doctor@demo.example.com, SEES: "Queue", NEVER: "Billing" } }
- runFlow: { file: subflows/role.yaml, env: { EMAIL: nurse@demo.example.com, SEES: "Queue", NEVER: "Results to review" } }
- runFlow: { file: subflows/role.yaml, env: { EMAIL: reception@demo.example.com, SEES: "Appointments", NEVER: "Pharmacy" } }
- runFlow: { file: subflows/role.yaml, env: { EMAIL: pharmacist@demo.example.com, SEES: "Pharmacy", NEVER: "Queue" } }
- runFlow: { file: subflows/role.yaml, env: { EMAIL: lab@demo.example.com, SEES: "Orders and results", NEVER: "Billing" } }
- runFlow: { file: subflows/role.yaml, env: { EMAIL: billing@demo.example.com, SEES: "Billing", NEVER: "Results to review" } }
- runFlow: { file: subflows/role.yaml, env: { EMAIL: admin@demo.example.com, SEES: "Administration", NEVER: "Patients" } }
