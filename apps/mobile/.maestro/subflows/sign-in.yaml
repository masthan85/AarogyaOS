# Signs in to the demo clinic with EMAIL and PASSWORD, both passed by the calling flow.
appId: in.aarogyaos.app
---
- launchApp:
    clearState: true
- tapOn: "Organisation"
- inputText: "demo-clinic"
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: ${PASSWORD}
# Tapping plain text closes the keyboard on this screen; the inputs offer no standard dismiss.
- tapOn: "Use the account your clinic gave you."
- tapOn:
    id: "sign-in"
