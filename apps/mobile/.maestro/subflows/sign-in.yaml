# Signs in to the demo clinic with EMAIL and PASSWORD, both passed by the calling flow. Inputs are
# found by test id: tapping a field's visible label does not move focus to it.
appId: in.aarogyaos.app
---
- launchApp:
    clearState: true
- tapOn:
    id: "login-organisation"
- inputText: "demo-clinic"
- tapOn:
    id: "login-email"
- inputText: ${EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}
# Back closes the keyboard on Android; these inputs offer no standard dismiss action.
- pressKey: back
- tapOn:
    id: "sign-in"
