# One role's smoke check: home appears, the role's main section is offered, a forbidden one is not
# on screen, and the main section opens without an error message.
appId: in.aarogyaos.app
---
- runFlow:
    file: sign-in.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: "Demo-pass-2026!"
- extendedWaitUntil:
    visible: "Today at a glance|The day at the clinic"
    timeout: 30000
- scrollUntilVisible:
    element: ${SEES}
    direction: DOWN
    timeout: 15000
- assertNotVisible: ${NEVER}
- tapOn: ${SEES}
- waitForAnimationToEnd
- assertNotVisible: "Could not load.*"
