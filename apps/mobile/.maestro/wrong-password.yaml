appId: in.aarogyaos.app
---
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: doctor@demo.example.com
      PASSWORD: not-the-password
- extendedWaitUntil:
    visible: "Email, password or organisation is incorrect."
    timeout: 20000
- assertNotVisible: "Today at a glance|The day at the clinic"
