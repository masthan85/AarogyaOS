name: CI
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: services/api/requirements.lock }
      - run: pip install -c requirements.lock -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pip install pip-audit && pip-audit --skip-editable --progress-spinner off
        continue-on-error: true  # advisory until triaged; see docs/OPERATIONS.md
      # Coverage is reported, not enforced: a threshold will be set once a baseline is agreed.
      - run: pytest -q --cov=app --cov-report=term:skip-covered
        env:
          AAROGYA_TEST_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
          AAROGYA_TEST_REDIS_URL: redis://localhost:6379/15

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npx expo export --platform android --output-dir /tmp/export
        env: { CI: "1", EXPO_NO_TELEMETRY: "1" }

  # Browser tests against the production web build and a real API, with the demo clinic and its
  # invented patient only. See docs/10-TESTING-GUIDE.md.
  web-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      AAROGYA_DATABASE_URL: postgresql+psycopg://aarogya_app:devpass@localhost:5432/aarogya
      AAROGYA_CORS_ORIGINS: '["http://localhost:8081"]'
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: services/api/requirements.lock }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/mobile/package-lock.json
            e2e/package-lock.json
      - name: Database and role (not a superuser, so row-level security applies)
        run: >-
          psql postgresql://postgres:postgres@localhost:5432/postgres
          -c "CREATE ROLE aarogya_app LOGIN PASSWORD 'devpass' NOSUPERUSER NOCREATEROLE NOBYPASSRLS"
          -c "CREATE DATABASE aarogya OWNER aarogya_app"
      - name: API with the demo clinic
        working-directory: services/api
        run: |
          pip install -c requirements.lock -e .
          alembic upgrade head
          python -m app.cli seed
          python -m app.cli demo-seed
          nohup uvicorn app.main:create_app --factory --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
      - name: Web build
        working-directory: apps/mobile
        run: |
          npm ci
          npx expo export --platform web --output-dir "$RUNNER_TEMP/web"
        env: { EXPO_PUBLIC_API_URL: "http://localhost:8000" }
      - name: Browser tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          nohup node serve-web.mjs "$RUNNER_TEMP/web" 8081 > "$RUNNER_TEMP/web.log" 2>&1 &
          curl --retry 20 --retry-delay 1 --retry-all-errors -sf http://localhost:8000/ready
          npx playwright test
      - if: failure()
        run: cat "$RUNNER_TEMP/api.log"
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: e2e/playwright-report, retention-days: 7 }

  # The Maestro flows in apps/mobile/.maestro on an Android emulator: a release build of the app
  # against a real API with the demo clinic and its invented patient only.
  android-maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      AAROGYA_DATABASE_URL: postgresql+psycopg://aarogya_app:devpass@localhost:5432/aarogya
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: services/api/requirements.lock }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Database and role (not a superuser, so row-level security applies)
        run: >-
          psql postgresql://postgres:postgres@localhost:5432/postgres
          -c "CREATE ROLE aarogya_app LOGIN PASSWORD 'devpass' NOSUPERUSER NOCREATEROLE NOBYPASSRLS"
          -c "CREATE DATABASE aarogya OWNER aarogya_app"
      - name: API with the demo clinic
        working-directory: services/api
        run: |
          pip install -c requirements.lock -e .
          alembic upgrade head
          python -m app.cli seed
          python -m app.cli demo-seed
          nohup uvicorn app.main:create_app --factory --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
      - name: Release build for the emulator
        working-directory: apps/mobile
        env:
          # The emulator reaches this machine's localhost at 10.0.2.2.
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8000
        run: |
          npm ci
          npx expo prebuild --platform android --no-install
          # The test API is plain HTTP on this machine. Allow that in this CI build only; app builds
          # for clinics keep Android's default of refusing unencrypted traffic.
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Maestro flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: apps/mobile
          script: |
            curl --retry 20 --retry-delay 1 --retry-all-errors -sf http://localhost:8000/ready
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            maestro test .maestro --format junit --output "$RUNNER_TEMP/maestro.xml" --debug-output "$RUNNER_TEMP/maestro-debug" || (adb shell uiautomator dump /sdcard/ui.xml >/dev/null; echo "Screen at failure:"; adb shell cat /sdcard/ui.xml | grep -o 'text="[^"]*"\|content-desc="[^"]*"\|resource-id="[^"]*"' | grep -v '=""' ; exit 1)
      - if: failure()
        run: cat "$RUNNER_TEMP/api.log"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: |
            ${{ runner.temp }}/maestro-debug
            ${{ runner.temp }}/maestro.xml
          include-hidden-files: true
          retention-days: 7
